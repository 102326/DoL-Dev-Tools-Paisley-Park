name: Paisley Park checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix experiments/weather-report-20261104/source-finder --ignore-scripts --no-audit --no-fund
      - run: npm --prefix experiments/weather-report-20261104/source-finder run build
      - run: node experiments/weather-report-20261104/source-finder/build-resolver.cjs --check
      - run: node experiments/weather-report-20261104/source-finder/check-types.cjs
      - run: node --test experiments/weather-report-20261104/source-finder/test/build.test.cjs
      - run: npm test
      - run: python -m pip install jsonschema==4.25.1 rfc3339-validator==0.1.4
      - run: python -m unittest discover -s tests -p 'test_*.py'
